services:
  pi-hub:
    build: .
    container_name: pi-hub
    restart: unless-stopped
    ports:
      - "0.0.0.0:31106:80"
    dns:
      - 192.168.68.115  # Pi-Hub WiFi (AdGuard/NGINX DNS) — primary
      - 192.168.68.57   # Pi-Hub eth0 — same device, wired fallback
      - 1.1.1.1         # public fallback
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1  # IPv4-only — IPv6 causes local connectivity issues
    # For dev with hot-reload, override with the dev service below
    # and run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

  # Uncomment to run the Vite dev server directly in Docker during development
  # pi-hub-dev:
  #   image: node:20-alpine
  #   container_name: pi-hub-dev
  #   working_dir: /app
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   ports:
  #     - "0.0.0.0:31106:31106"
  #   command: sh -c "npm install && npm run dev"
