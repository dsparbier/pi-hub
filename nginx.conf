# Included by the stock nginx image inside its http{} block, so `map` here is
# valid (http context). Everything else lives in server{}.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve the pi-hub-agent container IP after a restart
    resolver 127.0.0.11 valid=10s;

    # SPA routing — send all 404s back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # pi-hub-agent (metrics + read-only containers). Same compose project, no
    # published port — reachable only here. WebSockets (/agent/api/.../logs/stream,
    # /agent/api/.../stats/stream) need the Upgrade/Connection headers + long
    # read/send timeouts and buffering off. The browser supplies X-API-Key itself
    # from localStorage['fleet.console.keys']; nginx injects nothing.
    location /agent/ {
        # variable upstream + rewrite so nginx re-resolves via the resolver at
        # request time (not once at boot). With a variable in proxy_pass the URI
        # is NOT auto-stripped, so strip the /agent/ prefix explicitly.
        # `set` MUST precede `rewrite … break` — the break flag halts further
        # rewrite-phase directives, so a `set` after it would never run.
        set $agent_upstream pi-hub-agent:8080;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass http://$agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
